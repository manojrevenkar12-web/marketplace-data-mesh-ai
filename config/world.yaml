# The simulated marketplace (simulation only: read by mesh.sim and mesh.eval, never by the platform or the AI).
seed: 24
start: 2026-06-01            # history window: on-call tickets from these days train the triage classifier
live_from: 2026-08-15        # evaluation window
end: 2026-09-30
countries: {DE: 0.46, IT: 0.17, NL: 0.09, BE: 0.08, AT: 0.07, FR: 0.06, ES: 0.04, LU: 0.03}
dealers: 260
private_share: 0.3
new_listings_per_day: 520
leads_per_listing_day: 0.35
weekend_factor: 0.8
burn_in_days: 60            # days simulated before the start so stock and leads are steady
makes:
  Volkswagen: {Golf: 21000, Polo: 15000, Passat: 24000, Tiguan: 29000, ID.3: 31000}
  BMW: {"3 Series": 31000, "1 Series": 23000, X3: 41000, i4: 48000}
  Mercedes-Benz: {C-Class: 33000, A-Class: 25000, GLC: 46000}
  Audi: {A3: 25000, A4: 29000, Q5: 42000}
  Fiat: {"500": 11000, Panda: 9500, Tipo: 13000}
  Renault: {Clio: 12500, Megane: 15000, Captur: 18500}
  Tesla: {Model 3: 36000, Model Y: 41000}
  Skoda: {Octavia: 19500, Fabia: 13000}
  Toyota: {Yaris: 15500, Corolla: 21000, RAV4: 33000}
fuels: {petrol: 0.44, diesel: 0.3, electric: 0.11, hybrid: 0.13, lpg: 0.02}

# Incidents the platform has to cope with. Each produces failed runs; the true cause is written to
# data/truth/incidents.jsonl. Days are offsets from the window start; "history" incidents happen before
# live_from and end up as resolved on-call tickets, "live" ones are what the evaluation measures.
incidents:
  rate_history: 0.4          # chance per day of one history incident
  rate_live: 0.45
  mix:                       # relative frequency of each kind
    schema_drift: 2
    type_drift: 1.5
    late_drop: 2
    null_spike: 1.5
    duplicates: 1
    volume_drop: 1.5
    upstream_contract_change: 1
    code_change: 1.5
    access_denied: 1
    resource_exhausted: 1
    transient_infra: 1.5
