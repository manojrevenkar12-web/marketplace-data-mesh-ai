name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    name: platform (lint, types, tests, evaluation, gate)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      MESH_TEST_DATABASE_URL: postgresql://mesh:mesh@localhost:5432/mesh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: A database role without SUPERUSER, as in production
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE mesh LOGIN PASSWORD 'mesh' NOSUPERUSER NOCREATEROLE"
          psql -h localhost -U postgres -c "CREATE DATABASE mesh_test OWNER mesh"
      - name: Lint and types
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Contracts, generated files and prompt locks
        run: |
          mesh lint
          mesh dags render --check
          mesh infra render --check
          mesh prompts check
      - name: Tests
        run: pytest -q
      - name: Simulate the full marketplace, train, evaluate, release gate
        run: mesh run
      - name: Held-out first runs are never rewritten
        run: git diff --exit-code -- reports/heldout heldout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: reports/eval/

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - name: terraform validate
        run: |
          terraform validate -no-color > validate.log 2>&1 || {
            body=$(sed 's/%/%25/g' validate.log | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=terraform validate::$body"; exit 1; }

  airflow:
    name: airflow (the generated DAG loads)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Airflow with its constraints
        run: |
          pip install "apache-airflow==3.3.2" \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt
      - name: The DAG parses and follows the contracts' inputs
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          python - <<'PY'
          try:
              from airflow.dag_processing.dagbag import DagBag  # Airflow 3.1 and later
          except ImportError:
              from airflow.models.dagbag import DagBag
          bag = DagBag(dag_folder="dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          dag = bag.get_dag("mesh_daily")
          assert dag.get_task("pricing__price_ratings").upstream_task_ids == {"listings__listing_events"}
          print(len(dag.tasks), "tasks")
          PY

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: console end to end
    runs-on: ubuntu-24.04
    needs: [console]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      MESH_DATABASE_URL: postgresql://mesh:mesh@localhost:5432/mesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Database, platform and a small world
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE mesh LOGIN PASSWORD 'mesh' NOSUPERUSER NOCREATEROLE"
          psql -h localhost -U postgres -c "CREATE DATABASE mesh OWNER mesh"
          python -m venv .venv
          .venv/bin/pip install -e .
          .venv/bin/mesh sim --small > /dev/null
          .venv/bin/mesh train
          .venv/bin/mesh demo --seed-only > /dev/null
      - working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: web/test-results/

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mesh:ci .
      - name: The image simulates a small world and answers a question
        run: |
          docker run --rm mesh:ci sh -c "mesh sim --small > /dev/null && mesh ask --user anna.analyst 'How many leads did we get yesterday?'" | tee out.json
          grep -q '"status": "answered"' out.json
