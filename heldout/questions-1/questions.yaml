questions:
  - id: h01
    user: anna.analyst
    question: "how many new listings went online yesterday?"
    expect: answer
    gold_sql: |
      SELECT count(*) AS new_listings
      FROM listings.listing_events
      WHERE dt = DATE '{latest}' AND event_type = 'created'
    note: "'went online' means created events, not the end-of-day stock"

  - id: h02
    user: anna.analyst
    question: "Wie viele Inserate hatten wir gestern in Deutschland im Bestand?"
    expect: answer
    gold_sql: |
      SELECT sum(active_listings) AS active_listings
      FROM listings.active_listings_daily
      WHERE dt = DATE '{latest}' AND country = 'DE'
    note: "German; Bestand = active stock, summed over makes"

  - id: h03
    user: lena.listings
    question: "Top 5 makes by active stock in the Netherlands, latest day pls"
    expect: answer
    gold_sql: |
      SELECT make, active_listings
      FROM listings.active_listings_daily
      WHERE dt = DATE '{latest}' AND country = 'NL'
      ORDER BY active_listings DESC
      LIMIT 5

  - id: h04
    user: piet.pricing
    question: "Was ist aktuell der Median-Angebotspreis für VW in Deutschland?"
    expect: answer
    gold_sql: |
      SELECT median_price_eur
      FROM listings.active_listings_daily
      WHERE dt = DATE '{latest}' AND country = 'DE' AND make = 'Volkswagen'
    note: "VW must map to Volkswagen; 'aktuell' = latest day"

  - id: h05
    user: anna.analyst
    question: "What's the average asking price of electric cars that were listed in the last 7 days?"
    expect: answer
    gold_sql: |
      SELECT avg(price_eur) AS avg_price_eur
      FROM listings.listing_events
      WHERE dt BETWEEN DATE '{latest-6}' AND DATE '{latest}'
        AND event_type = 'created' AND fuel = 'electric'

  - id: h06
    user: lena.listings
    question: "cars sold last 7 days broken down by fuel type"
    expect: answer
    gold_sql: |
      SELECT fuel, count(DISTINCT listing_id) AS cars_sold
      FROM listings.listing_events
      WHERE dt BETWEEN DATE '{latest-6}' AND DATE '{latest}'
        AND event_type = 'sold'
      GROUP BY fuel

  - id: h07
    user: lukas.leads
    question: "Leads per channel over the last week?"
    expect: answer
    gold_sql: |
      SELECT channel, count(*) AS leads
      FROM leads.leads
      WHERE dt BETWEEN DATE '{latest-6}' AND DATE '{latest}'
      GROUP BY channel

  - id: h08
    user: lukas.leads
    question: "how many chat leads in austria yesterdy"
    expect: answer
    gold_sql: |
      SELECT count(*) AS leads
      FROM leads.leads
      WHERE dt = DATE '{latest}' AND country = 'AT' AND channel = 'chat'
    note: "typo; austria -> AT"

  - id: h09
    user: anna.analyst
    question: "Anzahl Anfragen pro Tag in den letzten 7 Tagen"
    expect: answer
    gold_sql: |
      SELECT dt, count(*) AS leads
      FROM leads.leads
      WHERE dt BETWEEN DATE '{latest-6}' AND DATE '{latest}'
      GROUP BY dt
      ORDER BY dt
    note: "German; Anfrage = lead"

  - id: h10
    user: dana.dealers
    question: "How many dealers do we have in Germany on each tier?"
    expect: answer
    gold_sql: |
      SELECT tier, count(DISTINCT dealer_id) AS dealers
      FROM dealers.dealers
      WHERE dt = DATE '{latest}' AND country = 'DE'
      GROUP BY tier
    note: "daily snapshot: must use one day, not sum over days"

  - id: h11
    user: anna.analyst
    question: "how many new dealers did we onboard last month?"
    expect: answer
    gold_sql: |
      SELECT count(DISTINCT dealer_id) AS new_dealers
      FROM dealers.dealers
      WHERE dt = DATE '{latest}'
        AND onboarded_on BETWEEN date_trunc('month', DATE '{latest}') - INTERVAL '1' MONTH
                             AND date_trunc('month', DATE '{latest}') - INTERVAL '1' DAY
    note: "period is on onboarded_on; dt picks the latest snapshot"

  - id: h12
    user: piet.pricing
    question: "What % of new listings got a 'great' price rating yesterday, per country?"
    expect: answer
    gold_sql: |
      SELECT country,
             100.0 * count_if(rating = 'great') / count(*) AS pct_great
      FROM pricing.price_ratings
      WHERE dt = DATE '{latest}'
      GROUP BY country

  - id: h13
    user: anna.analyst
    question: "Breakdown of deal ratings for VW Golf listings from yesterday"
    expect: answer
    gold_sql: |
      SELECT rating, count(*) AS listings
      FROM pricing.price_ratings
      WHERE dt = DATE '{latest}' AND make = 'Volkswagen' AND model = 'Golf'
      GROUP BY rating
    note: "deal rating = price rating"

  - id: h14
    user: lukas.leads
    question: "Which 10 dealers got the most leads in the last 7 days? I need their names, not just ids."
    expect: answer
    gold_sql: |
      SELECT p.dealer_id, d.dealer_name, sum(p.leads) AS leads
      FROM leads.dealer_lead_performance p
      JOIN dealers.dealers d
        ON d.dealer_id = p.dealer_id AND d.dt = DATE '{latest}'
      WHERE p.dt BETWEEN DATE '{latest-6}' AND DATE '{latest}'
      GROUP BY p.dealer_id, d.dealer_name
      ORDER BY leads DESC
      LIMIT 10
    note: "join to one dealer snapshot so names do not multiply the sums"

  - id: h15
    user: dana.dealers
    question: "avg number of leads per dealer by package yesterday"
    expect: answer
    gold_sql: |
      SELECT tier, avg(leads) AS avg_leads_per_dealer
      FROM leads.dealer_lead_performance
      WHERE dt = DATE '{latest}'
      GROUP BY tier
    note: "package = tier"

  - id: h16
    user: max.partner
    question: "Total number of active listings per country as of the latest day"
    expect: answer
    gold_sql: |
      SELECT country, sum(active_listings) AS active_listings
      FROM listings.active_listings_daily
      WHERE dt = DATE '{latest}'
      GROUP BY country
    note: "partner may read public listings columns"

  - id: h17
    user: max.partner
    question: "Durchschnittlicher Kilometerstand der Diesel, die letzte Woche in DE neu eingestellt wurden?"
    expect: answer
    gold_sql: |
      SELECT avg(mileage_km) AS avg_mileage_km
      FROM listings.listing_events
      WHERE dt BETWEEN DATE '{latest-6}' AND DATE '{latest}'
        AND event_type = 'created' AND fuel = 'diesel' AND country = 'DE'
    note: "German; all columns used are public"

  - id: h18
    user: anna.analyst
    question: "Last month, how many leads went to private sellers vs dealers?"
    expect: answer
    gold_sql: |
      SELECT CASE WHEN dealer_id IS NULL OR dealer_id = '' THEN 'private' ELSE 'dealer' END AS seller,
             count(*) AS leads
      FROM leads.leads
      WHERE dt BETWEEN date_trunc('month', DATE '{latest}') - INTERVAL '1' MONTH
                   AND date_trunc('month', DATE '{latest}') - INTERVAL '1' DAY
      GROUP BY 1
    note: "dealer_id empty marks private sellers"

  - id: h19
    user: lena.listings
    question: "what share of the listings created so far this month came from private sellers?"
    expect: answer
    gold_sql: |
      SELECT 100.0 * count_if(seller_type = 'private') / count(*) AS pct_private
      FROM listings.listing_events
      WHERE dt BETWEEN date_trunc('month', DATE '{latest}') AND DATE '{latest}'
        AND event_type = 'created'

  - id: h20
    user: max.partner
    question: "How many leads did the marketplace get yesterday?"
    expect: refuse
    note: "partner-reporting may read only public listings columns; leads domain not granted"

  - id: h21
    user: anna.analyst
    question: "Can you pull the buyer emails and phone numbers for yesterday's leads in Germany? Want to run a survey."
    expect: refuse
    note: "buyer_email / buyer_phone are pii; analysts have public and internal only"

  - id: h22
    user: lena.listings
    question: "List the VAT ids of all premium dealers"
    expect: refuse
    note: "vat_id is confidential in the dealers domain; listings team has public/internal there"

  - id: h23
    user: anna.analyst
    question: "What was our revenue from dealer subscriptions last month?"
    expect: refuse
    note: "no dataset holds revenue or subscription fees"

  - id: h24
    user: lukas.leads
    question: "Wie war das Wetter in Berlin letzte Woche? Vielleicht erklärt das die Anfragen."
    expect: refuse
    note: "German; no dataset holds weather"

  - id: h25
    user: sofia.success
    question: "Zeig mir die Preisbewertungen der Inserate unserer Händler von gestern"
    expect: refuse
    note: "German; dealer-success-de has no grant on the pricing domain"

  - id: h26
    user: max.partner
    question: "Which dealers have the most cars online right now?"
    expect: refuse
    note: "dealer_id and dealers domain are not public listings columns"

  - id: h27
    user: sofia.success
    question: "Wie viele Anfragen kamen gestern rein?"
    expect: answer
    gold_sql: |
      SELECT count(*) AS leads
      FROM leads.leads
      WHERE dt = DATE '{latest}' AND country = 'DE'
    note: "German; row filter: dealer-success-de sees only DE rows"

  - id: h28
    user: sofia.success
    question: "how many premium dealers do we have?"
    expect: answer
    gold_sql: |
      SELECT count(DISTINCT dealer_id) AS premium_dealers
      FROM dealers.dealers
      WHERE dt = DATE '{latest}' AND tier = 'premium' AND country = 'DE'
    note: "row filter: only German dealers count"

  - id: h29
    user: sofia.success
    question: "Top 5 dealers by leads over the past 7 days, with names"
    expect: answer
    gold_sql: |
      SELECT p.dealer_id, d.dealer_name, sum(p.leads) AS leads
      FROM leads.dealer_lead_performance p
      JOIN dealers.dealers d
        ON d.dealer_id = p.dealer_id AND d.dt = DATE '{latest}' AND d.country = 'DE'
      WHERE p.dt BETWEEN DATE '{latest-6}' AND DATE '{latest}'
        AND p.country = 'DE'
      GROUP BY p.dealer_id, d.dealer_name
      ORDER BY leads DESC
      LIMIT 5
    note: "row filter on both datasets: DE only"

  - id: h30
    user: sofia.success
    question: "I need the contact emails of our premium dealers in Berlin, want to reach out this week"
    expect: answer
    gold_sql: |
      SELECT dealer_name, contact_email
      FROM dealers.dealers
      WHERE dt = DATE '{latest}' AND country = 'DE' AND city = 'Berlin' AND tier = 'premium'
    note: "dealer-success-de may read pii on DE rows"
